version: "3.8"

services:
  wazuh-manager:
    image: wazuh/wazuh-manager:latest
    ports:
      - "1514:1514/udp"
      - "55000:55000/tcp"
    volumes:
      - ../manager/ossec.conf:/var/ossec/etc/ossec.conf
      - ../manager/rules:/var/ossec/etc/rules
      - ../manager/fim:/var/ossec/etc/shared
    environment:
      - INDEXER_URL=https://wazuh-indexer:9200
    networks:
      - wkt12-net

  wazuh-indexer:
    image: wazuh/wazuh-indexer:latest
    ports:
      - "9200:9200"
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    networks:
      - wkt12-net

  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:latest
    ports:
      - "5601:5601"
    environment:
      - INDEXER_URL=https://wazuh-indexer:9200
    depends_on:
      - wazuh-indexer
    networks:
      - wkt12-net

  wkt12-api:
    build: ../wkt12-api
    ports:
      - "8080:8080"
    volumes:
      - ../wkt12-api:/app
    networks:
      - wkt12-net

networks:
  wkt12-net:
    driver: bridge
