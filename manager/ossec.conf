<ossec_config>
  <global>
    <email_notification>no</email_notification>
    <logall>yes</logall>
  </global>

  <remote>
    <connection>secure</connection>
    <port>1514</port>
  </remote>

  <ruleset>
    <include>ruleset/rules/*.xml</include>
    <include>rules/wkt12_lfi_rules.xml</include>
    <include>rules/wkt12_rca_chain.xml</include>
  </ruleset>

  <integration>
    <name>wkt12_webhook</name>
    <hook_url>https://intel-center.example.com/intel/wazuh</hook_url>
    <level>10</level>
    <group>wkt12_lfi,wkt12_rca</group>
  </integration>
</ossec_config>
